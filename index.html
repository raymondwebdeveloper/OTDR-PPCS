<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PCCS | Under Construction</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f8fbf8;
        color: #111;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      body::before {
        content: "";
        position: absolute;
        width: 520px;
        height: 520px;
        background: radial-gradient(
          circle,
          rgba(34, 197, 94, 0.14),
          transparent 70%
        );
        top: -180px;
        right: -120px;
        border-radius: 50%;
      }

      body::after {
        content: "";
        position: absolute;
        width: 420px;
        height: 420px;
        background: radial-gradient(
          circle,
          rgba(22, 163, 74, 0.1),
          transparent 70%
        );
        bottom: -160px;
        left: -120px;
        border-radius: 50%;
      }

      .page {
        width: min(1100px, 90%);
        text-align: center;
        position: relative;
        z-index: 2;
      }

      .logo-mark {
        display: inline-flex;
        gap: 6px;
        margin-bottom: 24px;
        transform: skewX(-15deg);
      }

      .logo-mark span {
        width: 9px;
        height: 42px;
        background: #16a34a;
        display: block;
        border-radius: 3px;
      }

      .logo-mark span:nth-child(2) {
        opacity: 0.75;
      }

      .logo-mark span:nth-child(3) {
        opacity: 0.45;
      }

      .brand {
        font-size: 15px;
        letter-spacing: 0.22em;
        font-weight: 700;
        color: #15803d;
        margin-bottom: 48px;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(52px, 9vw, 60px);
        line-height: 0.9;
        letter-spacing: -0.06em;
        max-width: 900px;
        margin: 0 auto;
      }

      h1 span {
        color: #16a34a;
      }

      .description {
        max-width: 680px;
        margin: 48px auto 0;
        color: #5f6b62;
        font-size: 17px;
        line-height: 1.7;
      }

      .status {
        margin: 36px auto 0;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        border: 1px solid #cde7d4;
        background: rgba(255, 255, 255, 0.8);
        padding: 12px 18px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 700;
        color: #166534;
        backdrop-filter: blur(10px);
      }

      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.12);
        animation: pulse 1.8s infinite;
      }

      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 11px rgba(34, 197, 94, 0);
        }
      }

      .line {
        width: 160px;
        height: 3px;
        background: #16a34a;
        margin: 38px auto 0;
        border-radius: 999px;
        position: relative;
        overflow: hidden;
      }

      .line::after {
        content: "";
        position: absolute;
        width: 50px;
        height: 100%;
        background: #bbf7d0;
        animation: move 2s linear infinite;
      }

      @keyframes move {
        from {
          left: -50px;
        }

        to {
          left: 160px;
        }
      }

      footer {
        margin-top: 45px;
        font-size: 12px;
        color: #8a968c;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      @media (max-width: 600px) {
        .description {
          font-size: 15px;
        }

        h1 {
          font-size: 58px;
        }
      }
    </style>
  </head>

  <body>
    <main class="page">
      <div class="logo-mark">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <div class="brand">PCCS Fiber Optic / Telecom Training</div>

      <h1>
        WEBSITE<br />
        <span>UNDER CONSTRUCTION</span>
      </h1>

      <p class="description">
        OTDR – PCCS Training Center & Consultancy Services is currently building
        a new online experience for fiber optic and telecom training. Our new
        website will be launching soon.
      </p>

      <div class="status">
        <span class="status-dot"></span>
        New Website in Progress
      </div>

      <div class="line"></div>

      <footer>Formerly PTC Inc. • Since 2017</footer>
    </main>
  </body>
</html>
